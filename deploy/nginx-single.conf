# 单机部署：/api → 后端，其余 → 前端 SSR
#
# ⚠️ 已废弃：本机与 LoveCompass 共用 VPS 时，请改用 deploy/nginx-shared.conf
#    安装：sudo ./deploy/nginx-sync.sh
#    说明：见 deploy/MULTI-SITE.md
#
# 此文件仅保留作单站参考，勿再 cp 到 /etc/nginx/conf.d/iching.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.237.68.213 _;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
