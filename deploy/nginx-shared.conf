# 共享 VPS · 按 Host 分流（唯一 canonical 配置，勿再单独部署 iching.conf / lovecompass-shared.conf）
#
# | 入口                              | 站点          | 上游              |
# |-----------------------------------|---------------|-------------------|
# | http://47.237.68.213/             | 易测 iching   | :3000 / :3001     |
# | http://47.237.68.213/shadow/      | Shadow 复读线 | :3010             |
# | http://47.237.68.213:8080/        | 易测 备用     | :3000 / :3001     |
# | http(s)://47-237-68-213.sslip.io/ | LoveCompass   | :3002 + Vercel API|
# | https://yice.47-237-68-213.sslip.io/ | 易测 HTTPS | :3000 / :3001   |
# | https://yingyan.47-237-68-213.sslip.io/ | 鹰眼 EagleEye | :3700      |
# | https://cuoyuan.47-237-68-213.sslip.io/ | 厝园潮集·英歌游园 | :3800  |
#
# 安装：./deploy/nginx-sync.sh（iching 或 lovecompass 部署后都应执行）

upstream lovecompass_vercel_api {
    server lovecompass-api-backend.vercel.app:443;
}

# Supabase 用变量 + resolver 做运行时解析，避免项目下线/ DNS 失败时 Nginx 无法启动
# （upstream 块会在启动时解析域名，NXDOMAIN 会导致整站 80/443 挂掉）

upstream lovecompass_frontend {
    server 127.0.0.1:3002;
}

upstream iching_frontend {
    server 127.0.0.1:3000;
}

upstream iching_backend {
    server 127.0.0.1:3001;
}

upstream shadow_demo {
    server 127.0.0.1:3010;
}

upstream yingyan_app {
    server 127.0.0.1:3700;
}

upstream cuoyuan_app {
    server 127.0.0.1:3800;
}

# —— 易测：裸 IP :80（仅此块使用 default_server，避免与其它 conf 冲突）——
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.237.68.213;

    client_max_body_size 2m;

    location ^~ /shadow/api/ {
        rewrite ^/shadow/(api/.*)$ /$1 break;
        proxy_pass http://shadow_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /shadow/ {
        rewrite ^/shadow/(.*)$ /$1 break;
        proxy_pass http://shadow_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://iching_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://iching_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# —— 易测：HTTPS（微信支付回调 / 微信内 OAuth 须用此域名，勿用裸 IP）——
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yice.47-237-68-213.sslip.io;

    # 与 LoveCompass 共用证书（certbot --expand 加入 yice 子域名）
    ssl_certificate /etc/letsencrypt/live/47-237-68-213.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-237-68-213.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://iching_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 追问含重试余量，避免网关先于后端断开
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://iching_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name yice.47-237-68-213.sslip.io;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /api/ {
        proxy_pass http://iching_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://iching_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

