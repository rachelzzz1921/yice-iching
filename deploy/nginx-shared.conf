# —— LoveCompass：sslip.io HTTPS ——
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 47-237-68-213.sslip.io;

    ssl_certificate /etc/letsencrypt/live/47-237-68-213.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-237-68-213.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location = /health {
        proxy_pass https://lovecompass_vercel_api/health;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
    }

    location /api/ {
        proxy_pass https://lovecompass_vercel_api/;
        include /etc/nginx/snippets/lovecompass-proxy-params.conf;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /sb/ {
        resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        set $supabase_host wjfpglsygkbpubanylug.supabase.co;
        rewrite ^/sb/(.*)$ /$1 break;
        proxy_pass https://$supabase_host;
        proxy_ssl_server_name on;
        proxy_ssl_name wjfpglsygkbpubanylug.supabase.co;
        proxy_set_header Host wjfpglsygkbpubanylug.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://lovecompass_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

